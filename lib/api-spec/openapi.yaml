        maxConcurrency:
          type: integer
        bypassCSP:
          type: boolean
        stealthMode:
          type: boolean
        rules:
          type: array
          items:
            type: string
          description: If provided, only check these rule IDs (e.g. ["ACT-R14","ACT-R35"])
        wcagLevels:
          type: array
          items:
            type: string
          description: Accessibility scope levels selected for this scan
        proxyPacUrl:
          type: string
          description: PAC file URL to route scan traffic through a corporate proxy
        incremental:
          type: boolean
          description: Skip pages whose raw HTML is unchanged since the last completed scan, carrying previous issues forward
        aiContextualAssessment:
          type: boolean
          description: For direct manual scans only, ask the configured server-side AI provider to assess each detected issue occurrence
