openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Accessibility Scanner API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scans
    description: Accessibility scan operations
  - name: sites
    description: Site management and access control
  - name: projects
    description: Project and site association management
paths:
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - name: siteId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: includeUnassociated
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Projects visible to the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "400":
          description: Invalid site ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Site access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project under a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Project deleted
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/sites:
    post:
      operationId: associateProjectSite
      tags: [projects]
      summary: Associate an existing project with a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectSiteBody"
      responses:
        "204":
          description: Association created
        "400":
          description: Invalid project or site ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/sites/{siteId}:
    delete:
      operationId: removeProjectSiteAssociation
      tags: [projects]
      summary: Remove a project/site association
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Association removed
        "409":
          description: Existing scans use the association
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /scans:
    get:
      operationId: listScans
      tags: [scans]
      summary: List all scans
      description: Returns all scan sessions with summary info
      parameters:
        - name: siteId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of scans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanSession"

    post:
      operationId: createScan
      tags: [scans]
      summary: Create a new scan
      description: Start a new accessibility scan for one or more URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScanBody"
      responses:
        "201":
          description: Scan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSession"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scans/{id}:
    get:
      operationId: getScan
      tags: [scans]
      summary: Get scan details
      description: Returns scan session with all page results and issues
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scan session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSessionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateScan
      tags: [scans]
      summary: Update scan metadata (name, project, site, initiator)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScanBody"
      responses:
        "204":
          description: Updated
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteScan
      tags: [scans]
      summary: Delete a scan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scans/{id}/status:
    get:
      operationId: getScanStatus
      tags: [scans]
      summary: Get live scan status
      description: Returns current scan progress and per-URL status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current scan status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanStatus"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scans/{id}/cancel:
    post:
      operationId: cancelScan
      tags: [scans]
      summary: Cancel an ongoing scan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scans/{id}/report:
    get:
      operationId: getScanReport
      tags: [scans]
      summary: Get scan report summary
      description: Returns aggregated issue counts and statistics for the scan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanReport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scans/{scanId}/issues/{issueId}/ai-assessment/retry:
    post:
      operationId: retryAIAssessment
      tags: [scans]
      summary: Retry a failed manual-scan AI assessment
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: integer
        - name: issueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assessment requeued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [queued]
                required: [status]
        "403":
          description: Forbidden
        "404":
          description: Assessment not found
        "409":
          description: Assessment is not failed

  /sites/my-sites:
    get:
      operationId: getMySites
      tags: [sites]
      summary: Get sites accessible to the current user
      description: Returns all sites the authenticated user can access. Admins get all sites; regular users get only their assigned sites (direct + group).
      responses:
        "200":
          description: List of accessible sites with role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySitesResponse"

  /admin/sites/{id}/access:
    get:
      operationId: getSiteAccess
      tags: [sites]
      summary: List users and groups with access to a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Site access details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccessResponse"

  /admin/sites/{id}/users:
    post:
      operationId: grantSiteUserAccess
      tags: [sites]
      summary: Grant a user access to a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantSiteUserBody"
      responses:
        "201":
          description: Access granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /admin/sites/{id}/users/{userId}:
    delete:
      operationId: revokeSiteUserAccess
      tags: [sites]
      summary: Revoke a user's access to a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Access revoked

  /admin/sites/{id}/groups:
    post:
      operationId: grantSiteGroupAccess
      tags: [sites]
      summary: Grant a group access to a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantSiteGroupBody"
      responses:
        "201":
          description: Access granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /admin/sites/{id}/groups/{groupId}:
    delete:
      operationId: revokeSiteGroupAccess
      tags: [sites]
      summary: Revoke a group's access to a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Access revoked

  /scans/parse-sitemap:
    post:
      operationId: parseSitemap
      tags: [scans]
      summary: Parse a sitemap URL and return its URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseSitemapBody"
      responses:
        "200":
          description: List of URLs from sitemap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseSitemapResponse"
        "400":
          description: Invalid sitemap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ProjectSite:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
        - id
        - name

    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
        sites:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSite"
      required:
        - id
        - name
        - createdAt
        - sites

    CreateProjectBody:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        siteId:
          type: integer
          minimum: 1
      required:
        - name
        - siteId

    ProjectSiteBody:
      type: object
      properties:
        siteId:
          type: integer
          minimum: 1
      required:
        - siteId

    ScanSession:
      type: object
      properties:
        id:
          type: integer
        name:
          type: ["string", "null"]
        projectId:
          type: ["integer", "null"]
        siteId:
          type: ["integer", "null"]
        projectName:
          type: ["string", "null"]
        options:
          type: ["object", "null"]
          additionalProperties: true
        status:
          type: string
          enum: [pending, running, completed, cancelled, failed, paused]
        totalUrls:
          type: integer
        scannedUrls:
          type: integer
        failedUrls:
          type: integer
        totalIssues:
          type: integer
        criticalIssues:
          type: integer
        pagesWithIssues:
          type: integer
        createdAt:
          type: string
        completedAt:
          type: ["string", "null"]
      required:
        - id
        - status
        - totalUrls
        - scannedUrls
        - failedUrls
        - totalIssues
        - criticalIssues
        - createdAt
        - completedAt
        - name

    ScanSessionDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: ["string", "null"]
        projectId:
          type: ["integer", "null"]
        siteId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [pending, running, completed, cancelled, failed, paused]
        totalUrls:
          type: integer
        scannedUrls:
          type: integer
        failedUrls:
          type: integer
        totalIssues:
          type: integer
        criticalIssues:
          type: integer
        createdAt:
          type: string
        completedAt:
          type: ["string", "null"]
        initiatorName:
          type: ["string", "null"]
        initiatorRole:
          type: ["string", "null"]
        projectName:
          type: ["string", "null"]
        options:
          $ref: "#/components/schemas/ScanOptions"
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PageResult"
        ruleCoverage:
          type: array
          items:
            $ref: "#/components/schemas/RuleCoverage"
        automaticApplicabilityCoverage:
          type: number
        confidence:
          $ref: "#/components/schemas/ScanConfidence"
      required:
        - id
        - status
        - totalUrls
        - scannedUrls
        - failedUrls
        - totalIssues
        - criticalIssues
        - createdAt
        - completedAt
        - pages
        - name
        - initiatorName
        - initiatorRole
        - projectName

    PageResult:
      type: object
      properties:
        id:
          type: integer
        scanId:
          type: integer
        url:
          type: string
        status:
          type: string
          enum: [pending, scanning, completed, failed, skipped, requeued, not_available]
        issueCount:
          type: integer
        criticalCount:
          type: integer
        errorMessage:
          type: ["string", "null"]
        wafToken:
          type: ["string", "null"]
          description: Short-lived token for the Ampera WAF Scanner extension to authenticate local scan results
        scannedAt:
          type: ["string", "null"]
        loadDurationMs:
          type: ["integer", "null"]
        scanDurationMs:
          type: ["integer", "null"]
        finalUrl:
          type: ["string", "null"]
        httpStatus:
          type: ["integer", "null"]
        contentType:
          type: ["string", "null"]
        responseCapturedAt:
          type: ["string", "null"]
        acquisitionMethod:
          type: ["string", "null"]
        proxyStrategy:
          type: ["string", "null"]
        rawHtmlHash:
          type: ["string", "null"]
        renderedDomHash:
          type: ["string", "null"]
        carriedForward:
          type: boolean
          description: Whether this page's evidence was carried forward from a scoped prior scan.
        ruleStatuses:
          type: array
          items:
            $ref: "#/components/schemas/RuleExecutionStatus"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/AccessibilityIssue"
      required:
        - id
        - scanId
        - url
        - status
        - issueCount
        - criticalCount
        - errorMessage
        - scannedAt
        - loadDurationMs
        - scanDurationMs
        - issues

    AccessibilityIssue:
      type: object
      properties:
        id:
          type: integer
        pageId:
          type: integer
        ruleId:
          type: string
        ruleType:
          type: string
          enum: [Issue, "Potential Issue", "Best Practice", "WAI-ARIA"]
        impact:
          type: string
          enum: [critical, serious, moderate, minor]
        description:
          type: string
        element:
          type: ["string", "null"]
        elementContext:
          type: ["string", "null"]
        wcagCriteria:
          type: ["string", "null"]
        wcagLevel:
          type: ["string", "null"]
        selector:
          type: ["string", "null"]
        remediation:
          type: ["string", "null"]
        aiAssessment:
          oneOf:
            - $ref: "#/components/schemas/AIIssueAssessment"
            - type: "null"
      required:
        - id
        - pageId
        - ruleId
        - ruleType
        - impact
        - description
        - element
        - wcagCriteria
        - wcagLevel
        - selector
        - remediation
        - aiAssessment

    AIIssueAssessment:
      type: object
      properties:
        id:
          type: integer
        issueId:
          type: integer
        status:
          type: string
          enum: [queued, analyzing, completed, failed]
        decision:
          type: ["string", "null"]
          enum: [confirmed_issue, potential_issue, not_an_issue, needs_review, null]
        confidence:
          type: ["string", "null"]
          enum: [low, medium, high, null]
        rationale:
          type: ["string", "null"]
        evidence:
          type: array
          items:
            type: string
        engine:
          type: string
        provider:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        attempts:
          type: integer
        errorMessage:
          type: ["string", "null"]
        queuedAt:
          type: ["string", "null"]
        startedAt:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
      required:
        - id
        - issueId
        - status
        - decision
        - confidence
        - rationale
        - evidence
        - engine
        - provider
        - model
        - attempts
        - errorMessage
        - queuedAt
        - startedAt
        - completedAt

    ScanStatus:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, running, completed, cancelled, failed, paused]
        totalUrls:
          type: integer
        scannedUrls:
          type: integer
        failedUrls:
          type: integer
        currentUrl:
          type: ["string", "null"]
        counts:
          type: object
          additionalProperties:
            type: integer
        pagesWithIssues:
          type: integer
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PageStatus"
      required:
        - id
        - status
        - totalUrls
        - scannedUrls
        - failedUrls
        - currentUrl
        - counts
        - pagesWithIssues
        - pages

    PageStatus:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        status:
          type: string
          enum: [pending, navigating, scanning, rendering, analyzing, saving, completed, failed, skipped, requeued, not_available]
        issueCount:
          type: integer
        criticalCount:
          type: integer
        errorMessage:
          type: ["string", "null"]
        loadDurationMs:
          type: ["integer", "null"]
        scanDurationMs:
          type: ["integer", "null"]
      required:
        - id
        - url
        - status
        - issueCount
        - criticalCount
        - errorMessage
        - loadDurationMs
        - scanDurationMs

    RuleExecutionStatus:
      type: object
      properties:
        ruleId:
          type: string
        status:
          type: string
          enum: [not-selected, not-applicable, executed, failed]
        executionTier:
          type: string
          enum: [automatic, manual]
        carriedForward:
          type: boolean
      required: [ruleId, status, executionTier]

    RuleCoverage:
      type: object
      properties:
        ruleId:
          type: string
        selected:
          type: integer
        notSelected:
          type: integer
        notApplicable:
          type: integer
        executed:
          type: integer
        manual:
          type: integer
        failed:
          type: integer
        executionTier:
          type: string
          enum: [automatic, manual]
      required: [ruleId, selected, notSelected, notApplicable, executed, manual, failed, executionTier]

    ScanConfidence:
      type: object
      properties:
        classification:
          type: string
          enum: [high, medium, low, unavailable]
        score:
          type: ["number", "null"]
        basis:
          type: array
          items:
            type: string
        completedPages:
          type: integer
        failedPages:
          type: integer
        automaticApplicabilityCoverage:
          type: number
        manualUnresolved:
          type: integer
        potentialUnresolved:
          type: integer
        fallbackDenominatorPages:
          type: integer
        carriedForwardPages:
          type: integer
      required:
        - classification
        - score
        - basis
        - completedPages
        - failedPages
        - automaticApplicabilityCoverage
        - manualUnresolved
        - potentialUnresolved
        - fallbackDenominatorPages
        - carriedForwardPages

    ScanReport:
      type: object
      properties:
        scanId:
          type: integer
        totalPages:
          type: integer
        scannedPages:
          type: integer
        failedPages:
          type: integer
        totalIssues:
          type: integer
        issuesByImpact:
          $ref: "#/components/schemas/IssuesByImpact"
        issuesByWcagLevel:
          $ref: "#/components/schemas/IssuesByWcagLevel"
        topRules:
          type: array
          items:
            $ref: "#/components/schemas/RuleCount"
        pagesWithMostIssues:
          type: array
          items:
            $ref: "#/components/schemas/PageIssueCount"
        ruleCoverage:
          type: array
          items:
            $ref: "#/components/schemas/RuleCoverage"
        automaticApplicabilityCoverage:
          type: number
        confidence:
          $ref: "#/components/schemas/ScanConfidence"
      required:
        - scanId
        - totalPages
        - scannedPages
        - failedPages
        - totalIssues
        - issuesByImpact
        - issuesByWcagLevel
        - topRules
        - pagesWithMostIssues

    IssuesByImpact:
      type: object
      properties:
        critical:
          type: integer
        serious:
          type: integer
        moderate:
          type: integer
        minor:
          type: integer
      required:
        - critical
        - serious
        - moderate
        - minor

    IssuesByWcagLevel:
      type: object
      properties:
        A:
          type: integer
        AA:
          type: integer
        AAA:
          type: integer
      required:
        - A
        - AA
        - AAA

    RuleCount:
      type: object
      properties:
        ruleId:
