name: Build and Push Docker Image Latest

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build --no-cache \
          -t ghcr.io/sumitsinha-amp/ampera-act-scanner:${{ github.sha }} \
          -t ghcr.io/sumitsinha-amp/ampera-act-scanner:latest .
          
      - name: Push image
        run: |
          docker push ghcr.io/sumitsinha-amp/ampera-act-scanner:${{ github.sha }}
          docker push ghcr.io/sumitsinha-amp/ampera-act-scanner:latest

      - name: Deploy container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: Ampera-a11y-ACT-Scanner
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          images: ghcr.io/sumitsinha-amp/ampera-act-scanner:latest:${{ github.sha }}