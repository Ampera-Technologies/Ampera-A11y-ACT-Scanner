name: Build and Push Docker Image Latest

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build --no-cache -t ghcr.io/sumitsinha-amp/ampera-act-scanner:latest .

      - name: Push image
        run: |
          docker push ghcr.io/sumitsinha-amp/ampera-act-scanner:latest

      - name: Deploy container to Azure Web App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config container set \
              --name Ampera-a11y-ACT-Scanner \
              --resource-group a11y-act-scanner \
              --docker-custom-image-name ghcr.io/sumitsinha-amp/ampera-act-scanner:latest

            az webapp restart \
              --name Ampera-a11y-ACT-Scanner \
              --resource-group a11y-act-scanner